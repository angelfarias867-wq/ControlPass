<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>listBuses</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
  (function() {
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light-mode');
    }
  })();
</script>
</head>

<body>

  <div class="app-container">
    <header class="header">
      <button id="btn-config" class="icon-btn" aria-label="Configuración">C</button>

      <div class="search-container">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="bus-search-input" placeholder="..."
          autocomplete="off">
      </div>
    </header>

    <!-- Contenido Principal: Tarjetas dinámicas -->
    <main class="main-content">
      <div id="bus-list" class="bus-list">

        <!-- Estado Vacío (se oculta cuando hay buses) -->
        <div id="empty-state" class="empty-state">
          <p>no han ingresado buses el día de hoy</p>
        </div>

      </div>
    </main>

    <footer class="footer">
      <button id="btn-new-bus" class="btn-primary">Nuevo Bus</button>
    </footer>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
