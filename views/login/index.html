<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ControlPass - Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuente Roboto para el estilo WhatsApp -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Barra de navegación (Navbar) -->
  <header class="navbar">
    <div class="navbar-content">
      <span class="app-name">ControlPass</span>
      <a href="#" class="btn-register">Registro</a>
    </div>
  </header>

  <!-- Contenedor Principal (Layout de dos columnas) -->
  <main class="main-layout">
    
    <!-- Columna Izquierda: Ilustración/Logo -->
    <section class="illustration-column">
      <!-- Aquí puedes poner la imagen de tu ilustración -->
      <!-- <img src="tu-ilustracion.svg" alt="Ilustración ControlPass" class="main-img"> -->
      
      <!-- Placeholder estilizado para simular el logo/ilustración del boceto -->
      <div class="logo-placeholder">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="80" height="80" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <h2>Logo de la app</h2>
      </div>
    </section>

    <!-- Columna Derecha: Formulario de Login -->
    <section class="form-column">
      <div class="login-card">
        <h3>Bienvenido de nuevo</h3>
        <p class="subtitle">Ingresa tus credenciales para acceder.</p>
        
        <form action="#" method="POST" class="login-form">
          <div class="input-group">
            <label for="usuario">CORREO ELECTRÓNICO *</label>
            <input type="text" id="usuario" name="usuario" placeholder="ejemplo@correo.com" required autocomplete="off">
          </div>

          <div class="input-group">
            <label for="contrasena">CONTRASEÑA *</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="********" required>
          </div>

          <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
      </div>
    </section>

  </main>

</body>
</html>
