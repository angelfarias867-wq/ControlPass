<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Login</title>
  </head>

  <body class="page-body">
    <!-- Navbar -->
    <nav id="navbar" class="navbar-header"></nav>

    <!-- Contenedor de notificaciones -->
    <div id="notification" class="notification-container"></div>

    <!-- Contenedor Principal -->
    <div class="main-wrapper">
  
      <!-- Formulario Estilizado -->
      <div class="form-wrapper">
        <form id="form" class="login-form">
          <!-- Encabezado -->
          <div class="form-header">
            <h1 class="form-title">Bienvenido de nuevo</h1>
            <p class="form-subtitle">Ingresa tus credenciales para acceder.</p>
          </div>

          <!-- Nombre -->
          <div class="input-group">
            <label for="name-input" class="input-label">
              Nombre
              <span class="required-star">*</span>
            </label>
            <input
              type="text"
              id="name-input"
              name="name-input"
              autocomplete="username"
              placeholder="Ej. Juan Pérez"
              class="form-input"
            />
            <p class="input-error-msg"></p>
          </div>

          <!-- Contraseña -->
          <div class="input-group">
            <label for="password-input" class="input-label">
              Contraseña
              <span class="required-star">*</span>
            </label>
            <input
              type="password"
              id="password-input"
              name="password-input"
              autocomplete="current-password"
              placeholder="••••••••"
              class="form-input"
            />
            <p class="input-error-msg"></p>
          </div>

          <!-- Botón de Iniciar Sesión -->
          <button id="form-btn" class="submit-btn">
            Iniciar Sesión
          </button>
        </form>
      </div>
    </div>

    <!-- Clases dinámicas utilitarias (para estados/errores desde JS si los aplicas) -->
    <div class="hidden-utilities hidden outline-green outline-red outline-indigo outline-purple"></div>

    <script type="module" src="index.js"></script>
    <script src="../components/nav.js"></script>
  </body>
</html>
