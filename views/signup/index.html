<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <!-- Barra superior decorativa estilo WhatsApp Web -->
    <div class="top-accent-bar"></div>

    <nav id="navbar"></nav>

    <div id="notification"></div>

    <main class="main-container">
      <div class="form-wrapper">
        <form id="form">
          <div class="form-header">
            <h1 class="form-title">Crea tu cuenta</h1>
            <p class="form-subtitle">
            Ingresa tus datos para registrarte en la aplicación.
            </p>
          </div>

          <div class="input-group">
            <label for="name-input" class="input-label">
              Nombre completo
              <span class="required-asterisk">*</span>
            </label>
            <input
              type="text"
              id="name-input"
              name="name-input"
              autocomplete="name"
              placeholder="Ej. Juan Pérez"
              class="form-input"
            />
            <p class="input-hint">
              Nombre y apellido deben iniciar con mayúscula.
            </p>
          </div>

          <!-- EL CAMPO DE CORREO FUE ELIMINADO DE AQUÍ -->

          <div class="input-group">
            <label for="password-input" class="input-label">
              Contraseña
              <span class="required-asterisk">*</span>
            </label>
            <input
              type="password"
              id="password-input"
              name="password-input"
              autocomplete="new-password"
              placeholder="••••••••"
              class="form-input"
            />
            <div class="password-requirements">
              <ul class="requirements-list">
                <li>• Mínimo una letra.</li>
                <li>• Mínimo un número.</li>
                <li>• Mínimo 8 caracteres.</li>
              </ul>
            </div>
          </div>

          <div class="input-group">
            <label for="match-input" class="input-label">
              Confirmar contraseña
              <span class="required-asterisk">*</span>
            </label>
            <input
              type="password"
              id="match-input"
              name="match-input"
              autocomplete="new-password"
              placeholder="••••••••"
              class="form-input"
            />
          </div>

          <button id="form-btn" type="submit" disabled class="submit-btn">
            REGISTRAR CUENTA
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="index.js"></script>
    <script src="../components/nav.js"></script>
  </body>
</html>
