<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ControlPass - Chequeo del Día</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

  <header class="header">
    <div class="header-title-container">
      <a href="/configuration/" class="back-link">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        <span>Volver</span>
      </a>
      <h1 class="header-title">Chequeo del Día</h1>
    </div>
    <div id="today-date" class="role-badge">--/--/----</div>
  </header>

  <main class="main-container">
    <!-- Total acumulado general -->
    <div class="settings-card" style="padding: 1.25rem; text-align: center;">
      <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">TOTAL DÍA</span>
      <h2 id="total-buses-today"
        style="color: var(--accent-green); font-size: 2.25rem; font-weight: 800; margin-top: 0.25rem;">0</h2>
    </div>

    <!-- Lista por usuarios -->
    <section class="section-group">
      <h2 class="section-title general-title">Acreditaciones por usuario</h2>
      <div id="users-list" class="cards-container">
        <p style="padding: 1rem; color: var(--text-muted); text-align: center;">Cargando datos...</p>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>
